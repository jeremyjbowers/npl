<section class="mb-4">
    <h2 class="mb-1 font-bold">{{ title }}</h2>
    {% if can_edit %}
    <div class="space-y-2">
        {% for player_id in slots %}
        <select name="{{ field }}_{{ forloop.counter }}">
            <option value="">—</option>
            {% for id, label in pitchers %}
            <option value="{{ id }}" {% if id == player_id %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        {% endfor %}
    </div>
    {% else %}
    <ul>
        {% for player_id in slots %}
        {% if player_id %}<li>{% for id, label in pitchers %}{% if id == player_id %}{{ label }}{% endif %}{% endfor %}</li>{% endif %}
        {% endfor %}
    </ul>
    {% endif %}
</section>
