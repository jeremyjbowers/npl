{% extends "base.html" %}

{% block title %}Sign in — The NPL{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
    <h1 class="mb-2 text-2xl font-bold">Sign in to The NPL</h1>
    <p class="mb-4 text-sm">Enter your email. We'll send a sign-in link that lasts 30 days.</p>

    <form method="post" action="{% url 'account_login' %}" class="space-y-3">
        {% csrf_token %}
        <div>
            <label class="mb-1 block text-xs font-bold" for="login-email">Email</label>
            <input id="login-email" type="email" name="email" required autocomplete="email" placeholder="you@example.com" class="w-full">
        </div>
        <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
        <button type="submit" class="btn">Send magic link</button>
    </form>

    <p class="mt-4 text-xs text-gray-700">No account? Ask a league administrator. Check spam if the link doesn't arrive.</p>
</section>
{% endblock %}
