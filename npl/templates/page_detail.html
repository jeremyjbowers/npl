{% extends "base.html" %}

{% block title %}{{ page.title }} — The NPL{% endblock %}

{% block content %}
<article class="max-w-3xl">
    <header class="mb-4">
        <h1 class="text-2xl font-bold">{{ page.title }}</h1>
        {% if user.is_staff %}<p><a href="/admin/npl/page/{{ page.id }}/change/">Edit</a></p>{% endif %}
    </header>
    <div class="copy">{{ page.body.html|safe }}</div>
</article>
{% endblock %}
